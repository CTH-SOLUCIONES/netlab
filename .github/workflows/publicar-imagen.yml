# Construye la imagen del laboratorio y la publica en GitHub Container Registry
# como ghcr.io/cth-soluciones/netlab, en dos arquitecturas (amd64 y arm64) para
# que sirva igual en un PC de sala de cómputo, en una Mac o en un servidor ARM.
#
# Se ejecuta cuando cambia el código de la aplicación o este mismo archivo, y
# también a mano desde la pestaña Actions (workflow_dispatch).
name: Publicar imagen

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/publicar-imagen.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # QEMU permite construir la variante arm64 desde el runner amd64.
      - name: Preparar emulación multiarquitectura
        uses: docker/setup-qemu-action@v3

      - name: Preparar buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cth-soluciones/netlab
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
